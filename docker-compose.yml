# Local stack: PostgreSQL + FairBill API (with Tesseract OCR).
#   docker compose up --build
# Then run the app:  cd mobile && EXPO_PUBLIC_API_URL=http://<your-computer-ip>:8080 npx expo start
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fairbill
      POSTGRES_USER: fairbill
      POSTGRES_PASSWORD: fairbill
    volumes:
      - fairbill-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairbill"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      FAIRBILL_DB_URL: jdbc:postgresql://db:5432/fairbill
      FAIRBILL_DB_USER: fairbill
      FAIRBILL_DB_PASSWORD: fairbill
      FAIRBILL_PUBLIC_URL: ${FAIRBILL_PUBLIC_URL:-http://localhost:8080}
      # Generate once with: openssl rand -base64 32
      FAIRBILL_JWT_SECRET: ${FAIRBILL_JWT_SECRET:-}
      # Optional: better OCR on phone photos
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
    ports:
      - "8080:8080"
volumes:
  fairbill-db:
